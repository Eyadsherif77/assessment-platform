services:
  - type: web
    name: assessment-platform-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://client-pied-alpha.vercel.app,http://localhost:5173
      - key: DATABASE_URL
        fromDatabase:
          name: assessment-postgres-db
          property: connectionString

databases:
  - name: assessment-postgres-db
    databaseName: assessment_platform
    user: admin_edu
    plan: free
